listener 8883 127.0.0.1
protocol mqtt

cafile data/pki/ca/ca.crt
crlfile data/pki/ca/crl/ca.crl
certfile data/pki/mqtt/server.crt
keyfile data/pki/mqtt/server.key

require_certificate true
use_identity_as_username true
allow_anonymous false

tls_version tlsv1.2

persistence true
persistence_location data/mosquitto/

log_dest file data/logs/mosquitto.log
log_type all
connection_messages true

acl_file config/mosquitto/acl.conf
